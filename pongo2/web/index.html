<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Pongo</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      overscroll-behavior: none;
      touch-action: none;
    }

    body {
      color: #fff;
      font: 16px system-ui, sans-serif;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 1rem;
      text-align: center;
      pointer-events: none;
    }

    #loading[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <div id="loading" role="status">Loading Pongo...</div>
  <script src="wasm_exec.js"></script>
  <script>
    async function startGame() {
      const loading = document.getElementById("loading");
      try {
        const response = await fetch("pongo2.wasm");
        if (!response.ok) {
          throw new Error(`Could not load game (HTTP ${response.status})`);
        }
        const wasm = await response.arrayBuffer();
        const go = new Go();
        const { instance } = await WebAssembly.instantiate(wasm, go.importObject);
        loading.hidden = true;
        await go.run(instance);
      } catch (error) {
        loading.textContent = `Could not start Pongo: ${error.message}`;
        loading.setAttribute("role", "alert");
      }
    }

    startGame();
  </script>
</body>
</html>
